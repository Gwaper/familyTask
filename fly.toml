# Déploiement Fly.io (voir README § Déploiement). Le nom de l'app est choisi au `fly launch`.
app = "family-kanban"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8090"
  TZ = "Europe/Paris"
  RESET_TIME = "03:00"

# SQLite + photos : un seul volume, donc une seule machine.
[mounts]
  source = "kanban_data"
  destination = "/data/kanban"

# La machine s'arrête quand personne n'utilise l'app et redémarre à la première requête ;
# la remise à zéro manquée est rattrapée au démarrage.
[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
