# fly.toml app configuration file generated for familytask on 2026-11-26T20:36:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'familytask'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  RESET_TIME = '03:00'
  TZ = 'Europe/Paris'

[[mounts]]
  source = 'kanban_data'
  destination = '/data/kanban'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
