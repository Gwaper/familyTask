# Test de l'image sur le Mac (Docker Desktop) : http://localhost:8090, données dans ./data/kanban.
# docker compose up -d --build   (FAMILY_CODE=… docker compose up -d pour tester le code famille)
services:
  kanban:
    build: .
    image: family-kanban
    container_name: family-kanban
    init: true
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      PORT: ${PORT:-8090}
      RESET_TIME: ${RESET_TIME:-03:00}
      FAMILY_CODE: ${FAMILY_CODE:-}
      TZ: Europe/Paris
    volumes:
      - ./data/kanban:/data/kanban
